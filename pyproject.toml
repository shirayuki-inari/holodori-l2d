[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holodori-l2d"
version = "0.1.0"
description = "Download holodori Live2D assets and rebuild Cubism preview packages"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
assets = [
  "holodori-asset-tools @ git+https://github.com/HolodoriDB/holodori-asset-tools.git@13f150fe9dfbd367be53e5ea1c0a4ceb258b74f2",
]
test = ["pytest>=8,<10"]

[project.scripts]
holodori-l2d = "holodori_l2d.cli:main"
holodori-l2d-rebuild = "holodori_l2d.rebuild:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
