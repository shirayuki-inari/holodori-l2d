name: Release

# Pushing a version tag (for example `git tag v1.0.0 && git push origin v1.0.0`)
# tests the code, builds the package and publishes a GitHub Release with it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run offline tests
        run: |
          python -m pip install -e ".[test]" build
          python -m pytest -q
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import holodori_l2d; print(holodori_l2d.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build wheel and source archive
        run: python -m build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wheel="holodori_l2d-$VERSION-py3-none-any.whl"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$wheel"
          cat > notes.md <<EOF
          ## 安装 / Install

          需要 Python 3.10+，无需 Git。/ Requires Python 3.10+; Git is not needed.

          \`\`\`
          python -m pip install "holodori-l2d[assets] @ $url"
          \`\`\`

          然后运行 \`holodori-l2d\`；Windows 也可以下载下方的 \`run_live2d.bat\`，放到想保存模型的文件夹中双击运行。
          Then run \`holodori-l2d\`. On Windows you can also download \`run_live2d.bat\` below, put it in the folder where models should be saved, and double-click it.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* run_live2d.bat \
            --title "holodori-l2d $VERSION" --notes-file notes.md --generate-notes
